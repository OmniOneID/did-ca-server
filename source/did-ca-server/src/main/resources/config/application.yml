spring:
  application:
    name: cas
  profiles:
    active: dev, lss
    group:
        dev:
          - logging
          - spring-docs
          - database
          - wallet
          - blockchain
        sample:
          - logging
          - spring-docs
          - database-sample
          - wallet
        lss:
          - lss

  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

server:
  port: 8094

tas:
  url: http://localhost:8090

op-provider:
  url: http://localhost:8096

security:
  jwt:
    secret: "cas-admin-jwt-secret-key-must-be-at-least-32-chars"
    access-ttl-seconds: 1800    # 30 minutes
    refresh-ttl-seconds: 1209600 # 14 days

management:
  endpoints:
    web:
      exposure:
        include:
          - "health"
          - "shutdown"
  endpoint:
    health:
      show-details: "never"
    shutdown:
      enabled: true